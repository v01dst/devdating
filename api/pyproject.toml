[project]
name = "devdating-api"
version = "0.1.0"
description = "DevDating contributor-project matching API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "sqlalchemy[asyncio]==2.0.30",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "pydantic==2.7.4",
  "pydantic-settings==2.3.4",
  "httpx==0.27.0",
  "redis==5.0.4",
  "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "ruff==0.4.8",
  "mypy==1.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
